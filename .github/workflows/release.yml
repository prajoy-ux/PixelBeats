name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install

      - name: Sync Capacitor Web Assets
        run: |
          npx cap sync android

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare Release Artifacts
        run: |
          # Copy APK with clean official name
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} PixelBeats.apk \;
          # Package Source Code Zip
          RELEASE_TAG="${{ github.ref_name }}"
          if [ -z "$RELEASE_TAG" ]; then RELEASE_TAG="v1.1.5"; fi
          git archive --format=zip --output=PixelBeats-${RELEASE_TAG}-source.zip HEAD

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: PixelBeats ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            PixelBeats.apk
            PixelBeats-*.zip
